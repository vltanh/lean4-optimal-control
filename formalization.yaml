sources:
  - title: "Control Theory from the Geometric Viewpoint"
    authors:
      - "Andrei A. Agrachev"
      - "Yuri L. Sachkov"
    id: "doi:10.1007/978-3-662-06404-7"
    type: "book"
    location: >-
      Encyclopaedia of Mathematical Sciences 87, Springer, 2004; Chapter 12 (Lemmas 12.1-12.2,
      Theorems 12.1-12.5) and Theorem 10.1 (Filippov's theorem)
    relationship: "formalizes"
    note: >-
      The authors' draft of the book (preface dated September 2003), posted on A. A. Agrachev's
      home page (https://people.sissa.it/~agrachev/agrachev_files/books.html), was used; page
      numbers in the documentation are the draft's. Formalized: Chapter 12 (the Pontryagin maximum
      principle: Lemmas 12.1 and 12.2, Theorems 12.1-12.5, and the free-time case with a cost and
      mixed boundary conditions that the remarks after Theorems 12.3-12.5 leave to the reader) and
      Theorem 10.1 (Filippov's theorem), with the existence of optimal controls for integral costs
      that follows from it. The readings and departures D1-D11 are listed under fidelity.
    author_endorsement: "not-contacted"
  - title: "Symmetries and integrals of motion in optimal control"
    authors:
      - "H. J. Sussmann"
    id: "https://eudml.org/doc/262687"
    type: "article"
    location: >-
      Geometry in Nonlinear Control and Differential Inclusions, Banach Center Publications 32,
      Institute of Mathematics, Polish Academy of Sciences, Warszawa, 1995, pp. 379-393; Theorem
      4.1 (p. 389)
    relationship: "formalizes"
    note: >-
      Formalized: the definitions of Section 4 (symmetries of an optimal control system, their
      infinitesimal groups, the momentum map, controlled biextremals) and Theorem 4.1, the
      control version of Noether's theorem, as stated there (Pontryagin.sussmann_theorem4_1) and
      in a one-vector-field form under weaker hypotheses that is the statement of record
      (Pontryagin.noether). Sections 2-3 (Noether's theorem on a symplectic manifold, Theorems
      3.1-3.2) are not formalized as such: their argument is applied directly to the cotangent
      lift of a symmetry (S4). Section 5 is not formalized. Page numbers are those of the
      published paper. The readings S1-S8 are listed under fidelity.
    author_endorsement: "not-contacted"
  - title: "Principles of Optimal Control Theory"
    authors:
      - "R. V. Gamkrelidze"
    type: "book"
    location: "Plenum Press, New York, 1978"
    relationship: "background"
    note: >-
      Cited by Agrachev and Sachkov for the Caratheodory theory of control systems (existence,
      uniqueness and differentiable dependence of solutions); these facts are proved in the
      formalization by Picard iteration and Gronwall's inequality (departure D11).
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/willcforte/pontryagin-lean"
    relationship: "independent"
    note: >-
      An earlier Lean 4 development ("An attempt to formalize Pontryagin's Maximum Principle in
      Lean", May 2026) that states the key steps of the proof (Caratheodory existence, the adjoint
      equation, the tangent cone of the attainable set, the separation of cones, among others) as
      axioms, so it is not a complete formal proof. This work does not use it; its proofs follow
      Agrachev and Sachkov. No complete formal proof of the maximum principle was found.

status:
  scope: >-
    Formalized, from Agrachev and Sachkov's book (authors' draft): Chapter 12, that is Lemma 12.1
    (with its Remark (1), on any convex cone), Lemma 12.2, Theorems 12.1-12.5, and the maximum
    principle with free terminal time, an integral cost and mixed boundary conditions that the
    remarks after Theorems 12.3-12.5 leave to the reader, for strong local minimizers; Theorem 10.1
    (Filippov's theorem: the attainable sets at time T and up to time T are compact) and the
    existence of optimal controls for integral costs with fixed and free terminal time; an
    extension of both, by the same argument, to a closed state constraint, a compact set of initial
    points, a closed endpoint relation and a window of terminal times
    (ControlSystem.isCompact_constrainedEndpoints, ControlSystem.exists_optimal_constrained);
    Proposition 11.3 and the variations formula (12.13), read pointwise along trajectories (D2);
    and the Caratheodory theory that the source cites (D11). From Sussmann's paper: the
    definitions of Section 4 and Theorem 4.1 (Pontryagin.sussmann_theorem4_1), with its
    one-vector-field form under weaker hypotheses (Pontryagin.noether), its Lie-algebra form
    (Pontryagin.noether_momentumMap) and the maximum principle with Noether's integrals of motion
    (Pontryagin.maximum_principle_noether). The Challenge states the maximum principle (free time,
    cost, mixed boundary conditions), Filippov's theorem in both forms, the existence of optimal
    controls in both forms, and Noether's theorem in its one-vector-field form; Theorems 12.1-12.5
    (Pontryagin.theorem12_1 to theorem12_5), the forms with a state constraint and Sussmann's own
    form of Theorem 4.1 are proved in the library but are not part of the Challenge. Not
    formalized: the setting of manifolds (the state space is an open subset of a finite-dimensional
    real normed space, D1 and S1), the chronological calculus as such (D2), the other results and
    chapters of the book, and Sections 2-3 (Noether's theorem on a symplectic manifold, whose
    argument is applied directly to the cotangent lift, S4) and 5 of Sussmann's paper. Brouwer's
    fixed-point theorem comes from the FixedPoint package, a dependency of the proofs only (D10).
    Nothing is assumed: there is no sorry and no axiom, and the axiom audit (scripts/Audit.lean)
    checks every declaration of the library.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

