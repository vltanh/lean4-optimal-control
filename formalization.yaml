# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Pontryagin maximum principle and Filippov's theorem"
  description: >-
    A Lean 4 formalization, with Mathlib, of the Pontryagin maximum principle and of Filippov's
    theorem, following A. A. Agrachev and Yu. L. Sachkov, Control Theory from the Geometric
    Viewpoint (Encyclopaedia of Mathematical Sciences 87, Springer, 2004), Chapter 12 and Theorem
    10.1. Control systems q' = f(q, u) live on an open subset of a finite-dimensional real normed
    space, with measurable controls taking values in a compact set and trajectories in the sense
    of Caratheodory.


    The main result is the maximum principle with free terminal time, an integral cost and mixed
    boundary conditions (q(0), q(T)) in N, for strong local minimizers, with C^1 data: there are
    nu <= 0 and a Lipschitz covector curve p, with (nu, p(t)) nonzero for every t, that satisfy the
    adjoint equation, the maximum condition and the vanishing of the Hamiltonian for almost every
    t, and the transversality condition. Agrachev and Sachkov leave this case to the reader; their
    Lemmas 12.1 and 12.2 and Theorems 12.1-12.5 (the geometric maximum principle, free time without
    cost, and integral costs with fixed, separated and mixed boundary conditions) are proved too.
    Filippov's theorem: for a continuous control system with compact control set, convex velocity
    sets and bounded velocities, the attainable sets at time T and up to time T are compact; hence
    optimal controls exist for integral costs whose extended velocity sets are convex, with fixed
    or free terminal time. Both results are also proved, by the same argument, for problems posed
    on part of the space: trajectories confined to a closed set S (the dynamics and the cost need
    only be continuous, the velocities bounded and the velocity sets convex on S x U), starting in
    a compact set, with initial and terminal points in a closed relation, and terminal times in a
    window [T0, T1].


    Everything the proofs use is proved: existence, uniqueness and differentiable dependence of
    Caratheodory solutions, the variations formula and needle variations, Lebesgue points, and
    measurable selection (Kuratowski-Ryll-Nardzewski). Brouwer's fixed-point theorem is taken from
    the separate Lean package FixedPoint. No axiom beyond Lean's standard three is used.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.OC"]
  msc2020: ["49K15", "49J15", "93B03", "93C15", "34A12"]

sources:
  - title: "Control Theory from the Geometric Viewpoint"
    authors:
      - "Andrei A. Agrachev"
      - "Yuri L. Sachkov"
    id: "doi:10.1007/978-3-662-06404-7"
    type: "book"
    location: >-
      Encyclopaedia of Mathematical Sciences 87, Springer, 2004; Chapter 12 (Lemmas 12.1-12.2,
      Theorems 12.1-12.5) and Theorem 10.1 (Filippov's theorem)
    relationship: "formalizes"
    note: >-
      The authors' draft of the book (preface dated September 2003), posted on A. A. Agrachev's
      home page (https://people.sissa.it/~agrachev/agrachev_files/books.html), was used; page
      numbers in the documentation are the draft's. Formalized: Chapter 12 (the Pontryagin maximum
      principle: Lemmas 12.1 and 12.2, Theorems 12.1-12.5, and the free-time case with a cost and
      mixed boundary conditions that the remarks after Theorems 12.3-12.5 leave to the reader) and
      Theorem 10.1 (Filippov's theorem), with the existence of optimal controls for integral costs
      that follows from it. The readings and departures D1-D11 are listed under fidelity.
    author_endorsement: "not-contacted"
  - title: "Principles of Optimal Control Theory"
    authors:
      - "R. V. Gamkrelidze"
    type: "book"
    location: "Plenum Press, New York, 1978"
    relationship: "background"
    note: >-
      Cited by Agrachev and Sachkov for the Caratheodory theory of control systems (existence,
      uniqueness and differentiable dependence of solutions); these facts are proved in the
      formalization by Picard iteration and Gronwall's inequality (departure D11).
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/willcforte/pontryagin-lean"
    relationship: "independent"
    note: >-
      An earlier Lean 4 development ("An attempt to formalize Pontryagin's Maximum Principle in
      Lean", May 2026) that states the key steps of the proof (Caratheodory existence, the adjoint
      equation, the tangent cone of the attainable set, the separation of cones, among others) as
      axioms, so it is not a complete formal proof. This work does not use it; its proofs follow
      Agrachev and Sachkov. No complete formal proof of the maximum principle was found.

status:
  scope: >-
    Formalized, from Agrachev and Sachkov's book (authors' draft): Chapter 12, that is Lemma 12.1
    (with its Remark (1), on any convex cone), Lemma 12.2, Theorems 12.1-12.5, and the maximum
    principle with free terminal time, an integral cost and mixed boundary conditions that the
    remarks after Theorems 12.3-12.5 leave to the reader, for strong local minimizers; Theorem 10.1
    (Filippov's theorem: the attainable sets at time T and up to time T are compact) and the
    existence of optimal controls for integral costs with fixed and free terminal time; an
    extension of both, by the same argument, to a closed state constraint, a compact set of initial
    points, a closed endpoint relation and a window of terminal times
    (ControlSystem.isCompact_constrainedEndpoints, ControlSystem.exists_optimal_constrained);
    Proposition 11.3 and the variations formula (12.13), read pointwise along trajectories (D2);
    and the Caratheodory theory that the source cites (D11). The Challenge states the maximum principle
    (free time, cost, mixed boundary conditions), Filippov's theorem in both forms and the
    existence of optimal controls in both forms; Theorems 12.1-12.5 (Pontryagin.theorem12_1 to
    theorem12_5) and the forms of Filippov's theorem and of the existence of optimal controls with
    a state constraint are proved in the library but are not part of the Challenge. Not formalized: the
    setting of manifolds (the state space is an open subset of a finite-dimensional real normed
    space, D1), the chronological calculus as such (D2), and the other results and chapters of the
    book. Brouwer's fixed-point theorem comes from the FixedPoint package, a dependency of the
    proofs only (D10). Nothing is assumed: there is no sorry and no axiom, and the axiom audit
    (scripts/Audit.lean) checks every declaration of the library.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

